name: Update tt-rss Submodule

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write # required to create the "automated" label if it is missing

env:
  UPSTREAM_REPO: "https://github.com/tt-rss/tt-rss.git"
  SUBMODULE_PATH: "tt-rss"

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    # Serialize runs so two overlapping updates cannot force-push the shared
    # branch out of order; an in-progress run is allowed to finish.
    concurrency:
      group: update-tt-rss-submodule
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always base the update on main, even when the workflow is dispatched
          # from another branch, so the PR cannot pick up unrelated commits.
          ref: main
          submodules: true
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current submodule commit
        id: current
        run: |
          cd ${{ env.SUBMODULE_PATH }}
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Fetch latest from upstream
        run: |
          git submodule update --remote --init ${{ env.SUBMODULE_PATH }}

      - name: Get new submodule commit
        id: new
        run: |
          cd ${{ env.SUBMODULE_PATH }}
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: diff
        run: |
          if ! git diff --quiet ${{ env.SUBMODULE_PATH }}/; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "summary=Updated from ${{ steps.current.outputs.short }} to ${{ steps.new.outputs.short }}" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "summary=No changes needed" >> $GITHUB_OUTPUT
          fi

      - name: Create update branch and PR
        id: pr
        if: steps.diff.outputs.updated == 'true'
        env:
          # Required by the GitHub CLI, otherwise `gh pr create` exits with code 4
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Single rolling branch owned by this workflow, so re-running the job
          # (or the next weekly run) updates this branch and its pull request
          # instead of failing with a non-fast-forward push.
          BRANCH_NAME: automated/tt-rss-submodule-update
          PR_LABEL: automated
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Get latest upstream commit message for context
          cd ${{ env.SUBMODULE_PATH }}
          UPSTREAM_MSG=$(git log -1 --format='%s' HEAD 2>/dev/null || echo "Latest upstream update")
          NEW_SUBMODULE=$(git rev-parse HEAD)
          cd ..

          # main can move while this run is in flight (or a push can land);
          # skip if the submodule is already at this commit there, so the rolling
          # branch is never rewound to a stale state.
          git fetch --depth=1 origin main
          if [ "$(git rev-parse "origin/main:${{ env.SUBMODULE_PATH }}")" = "$NEW_SUBMODULE" ]; then
            echo "action=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          UNIQUE_BRANCH="${{ env.BRANCH_NAME }}"
          
          git add ${{ env.SUBMODULE_PATH }}/
          git checkout -B "$UNIQUE_BRANCH"
          git commit -m "chore: update tt-rss submodule to latest"
          # The rolling branch is owned by this workflow, so overwrite it on every
          # run; without --force a re-run is rejected as non-fast-forward once the
          # upstream submodule has moved past the commit pushed by the first run.
          git push --force -u origin "$UNIQUE_BRANCH"
          
          # Create the label only when it is missing; --force would reset the
          # color and description of a label used elsewhere in the repository.
          if ! gh label list --search "$PR_LABEL" --json name --jq '.[].name' | grep -qx "$PR_LABEL"; then
            gh label create "$PR_LABEL" \
              --description "Automated changes" \
              --color "ededed" >/dev/null
          fi

          PR_BODY=$(printf '## Submodule Update\n\n**Upstream:** %s\n\n**Changes:**\n- Previous commit: %s\n- New commit: %s\n\n**Latest upstream commit:** %s\n\nThis PR updates the tt-rss submodule to the latest upstream commit. Please review before merging.' "${{ env.UPSTREAM_REPO }}" "${{ steps.current.outputs.short }}" "${{ steps.new.outputs.short }}" "$UPSTREAM_MSG")

          # Re-running the same job reuses the branch, so update an existing PR instead of failing
          EXISTING_PR=$(gh pr list --head "$UNIQUE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body "$PR_BODY" --add-label "$PR_LABEL"
            echo "action=updated" >> "$GITHUB_OUTPUT"
            echo "Updated existing pull request #$EXISTING_PR"
          else
            gh pr create \
              --title "Update tt-rss submodule" \
              --body "$PR_BODY" \
              --base main \
              --label "$PR_LABEL"
            echo "action=created" >> "$GITHUB_OUTPUT"
          fi
          
          echo "branch=$UNIQUE_BRANCH" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Submodule Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.diff.outputs.summary }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream | ${{ env.UPSTREAM_REPO }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.diff.outputs.updated }}" == "true" ]; then
            echo "| Previous | \`${{ steps.current.outputs.short }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| New | \`${{ steps.new.outputs.short }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.diff.outputs.updated }}" != "true" ]; then
            echo "✅ Already up to date. No action needed." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.pr.outputs.action }}" == "up-to-date" ]; then
            echo "✅ Submodule already at this commit on \`main\`. No pull request needed." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ New update available. Pull request ${{ steps.pr.outputs.action }} for review." >> $GITHUB_STEP_SUMMARY
          fi
